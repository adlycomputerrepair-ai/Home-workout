/* Exercise info */
const exerciseInfo={

"Jumping jacks":"Stand straight. Jump and open your legs while raising your hands above your head, like making a big star ⭐. Then jump back to normal. Keep it light and bouncy. This wakes up your whole body and makes your heart beat faster.",

"Arm circles":"Stretch your arms out like airplane wings ✈️. Make small circles, then bigger circles. Do forward and backward. This warms up your shoulders so they don’t get hurt when pulling.",

"Wrist circles":"Hold your hands out and slowly draw circles with your wrists 🔄. Do both directions. This helps your fingers and wrists get ready for gripping things like climbing holds.",

"Scapula pull ups":"Hang on a bar with straight arms. Don’t bend your elbows. Just pull your shoulders down like you are trying to make your neck longer. Then relax. This makes your shoulders strong and safe.",

"Climbing (Technique focus)":"Climb easy routes slowly. Use your feet a lot 👣 and keep your body close to the wall. Move quietly and smoothly. Think like a ninja 🥷, not a monkey. This helps you climb longer without getting tired.",

"Pull ups":"Hold the bar. Pull your body up until your chin goes over the bar. Then go down slowly. No swinging. Imagine you are pulling yourself up a wall. This makes your back strong for climbing.",

"Single-arm dumbbell row":"Put one hand on a bench. Hold dumbbell with other hand. Pull it up toward your waist like starting a lawn mower 🚜. Keep your back straight. This makes one side of your back strong (very useful for climbing).",

"Lat pulldown":"Sit on machine, grab the bar, and pull it down to your chest. Keep your chest up. Slowly let it go back up. This is like a beginner pull-up and helps build climbing strength.",

"Seated cable row":"Sit and pull the handle toward your stomach. Keep your back straight. Squeeze your shoulder blades together like holding a pencil between them ✏️. This builds strong back muscles.",

"Hanging leg raises":"Hang from a bar and lift your legs up. Try to keep them straight. Don’t swing. Imagine your legs are heavy and you are lifting them slowly. This makes your core strong like a rock 🪨.",

"Light jog":"Run slowly like you are chasing a turtle 🐢. Not fast. Just enough to feel warm. This gets blood moving in your body.",

"Jogging":"Run at a steady speed. Not too fast, not too slow. Breathe nicely. This helps you not get tired quickly when climbing.",

"Hip rotation":"Put hands on hips and draw big circles with your hips 🔄. This helps your legs move better when stepping on holds.",

"Plank":"Put your forearms on the floor and keep your body straight like a wooden plank 🪵. Don’t let your hips drop. This makes your core strong so you don’t swing on the wall.",

"Russian twist":"Sit on the floor and twist your body side to side like you are passing a ball 🏀. Keep your core tight. This helps control your body while climbing.",

"Arm swing":"Swing your arms forward and backward gently. Like warming up before playing. This loosens your shoulders.",

"Scapula activation":"Small easy shoulder movements. Like scapula pull-ups but lighter. This wakes up your back muscles before hard work.",

"Dead hang":"Hold a bar and just hang there. Let your body relax but keep shoulders slightly active. Imagine you are hanging from a tree 🌳. This makes your grip super strong.",

"Towel hang":"Put a towel over a bar and hold it. Hang using the towel. It feels harder because it moves. This makes your fingers very strong 💪.",

"Single-arm farmer hold":"Hold a dumbbell in one hand and stand tall. Don’t lean. Stay straight like a soldier 🪖. This trains your grip and balance.",

"Hammer curl (dumbbell)":"Hold dumbbell like holding a hammer 🔨 (thumb pointing up). Lift it up and down slowly. This makes your arms and forearms stronger.",

"Cable wrist curl":"Hold cable or weight and bend your wrist up and down. Only move your wrist. This strengthens your forearms for gripping.",

"Reverse wrist curl":"Same as wrist curl but palm facing down. Lift your hand up using your wrist. This balances your forearm strength.",

"Dynamic stretch":"Move your body while stretching (like leg swings). Don’t stay still. This wakes up muscles safely before exercise.",

"Mobility session":"Slow, easy movements for your whole body. Think of it like oiling your joints so they move smoothly ⚙️.",

"Core (plank)":"Same as plank. Keep body straight and strong. Imagine someone can put a cup on your back ☕ without it falling.",

"Back stretch":"Bend forward or sit back like child’s pose. Relax your back. This removes tightness after exercise.",

"Shoulder mobility":"Move your shoulders in all directions slowly. Keep them smooth and controlled. This helps avoid injury.",

"Climbing (Power)":"Climb harder routes with bigger moves 💥. Use more strength and speed. Like jumping between holds. This builds power.",

"Pike push ups":"Put your body in a triangle shape 🔺. Lower your head to the floor and push back up. This makes your shoulders strong.",

"Single-arm dumbbell shoulder press":"Hold dumbbell and push it above your head. Keep your body steady. Don’t lean. This builds strong shoulders for climbing moves.",

"Chest press machine":"Push the handles forward like you are pushing a heavy door 🚪. This trains your chest and arms.",

"Tricep pushdown":"Push the cable down using your arms. Keep elbows close. This makes your arms stronger for pushing movements.",

"Goblet squat (dumbbell)":"Hold dumbbell close to chest and squat down like sitting on a chair 🪑. Keep chest up. This builds strong legs for pushing on footholds.",

"Leg press machine":"Push the platform away using your legs. Like pushing a heavy wall. This builds strong legs safely.",

"Single-leg Romanian deadlift":"Stand on one leg and bend forward while holding dumbbell. Keep balance. This improves balance and leg strength.",

"Leg raises":"Lift your legs up slowly. Keep control. This strengthens your lower abs for climbing tension.",

"Hip flexor stretch":"Step one foot forward and push hips forward gently. This helps you step higher on climbs.",

"Lat stretch":"Reach your arms up and lean slightly. Feel stretch on your sides. This relaxes muscles used for pulling.",

"Forearm stretch":"Stretch your arm and gently pull your fingers back. This relaxes your grip muscles after climbing.",

"Shoulder stretch":"Pull one arm across your chest. This helps your shoulders relax.",

"Hamstring stretch":"Reach down toward your toes. Keep legs straight. This helps flexibility for high steps.",

"Quad stretch":"Stand and pull your foot to your back. Keep knees close. This relaxes your thigh muscles."

/* TIMER */
let timerInterval;

function startTimer(seconds,id){
clearInterval(timerInterval);
let remaining=seconds;

timerInterval=setInterval(()=>{
let min=Math.floor(remaining/60);
let sec=remaining%60;
document.getElementById(id).innerText=(min>0?min+"m ":"")+sec+"s";
remaining--;
if(remaining<0){
clearInterval(timerInterval);
document.getElementById(id).innerText="Done!";
}
},1000);
}

/* Save progress */
function saveProgress(dateKey,name,sets,reps){
let data=JSON.parse(localStorage.getItem("workoutProgress")||"{}");
if(!data[dateKey]) data[dateKey]={};
if(!data[dateKey][name]) data[dateKey][name]={};
if(sets!==null) data[dateKey][name].sets=sets;
if(reps!==null) data[dateKey][name].reps=reps;
localStorage.setItem("workoutProgress",JSON.stringify(data));
}

function getProgress(dateKey,name){
let data=JSON.parse(localStorage.getItem("workoutProgress")||"{}");
return data?.[dateKey]?.[name] || {};
}

function addTimerIfNeeded(name,reps){
let id="timer_"+name.replace(/\s/g,'');
if(reps.includes("sec")){
let sec=parseInt(reps);
return `<button onclick="startTimer(${sec},'${id}')">Timer</button> <span id="${id}"></span>`;
}
if(reps.includes("min")){
let sec=parseInt(reps)*60;
return `<button onclick="startTimer(${sec},'${id}')">Timer</button> <span id="${id}"></span>`;
}
return "";
}

function renderList(title,list,dateKey){
let html=`<h4>${title}</h4>`;
list.forEach(w=>{
let val=getProgress(dateKey,w.name);
html+=`
<div>
${w.name} (${w.sets} sets x ${w.reps})
<button class="infoBtn" onclick="showInfo('${w.name}')">ℹ</button>
${addTimerIfNeeded(w.name,w.reps)}
<br>
Sets Achieved
<input type="number" value="${val.sets||''}" onchange="saveProgress('${dateKey}','${w.name}',this.value,null)">
Reps/Time
<input type="number" value="${val.reps||''}" onchange="saveProgress('${dateKey}','${w.name}',null,this.value)">
</div>
`;
});
return html;
}

function showWorkout(date){
let day=date.toLocaleDateString('en-US',{weekday:'short'});
let data=workouts[day];
let dateKey=date.toISOString().split("T")[0];

let html=`<h3>${day} Workout</h3>`;
html+=`<h4>Pre-Workout</h4><p>${data.pre}</p>`;
html+=renderList("Warm Up",data.warmup,dateKey);
html+=renderList("Workout",data.main,dateKey);
html+=renderList("Cool Down",data.cooldown,dateKey);
html+=`<h4>Post-Workout</h4><p>${data.post}</p>`;

document.getElementById("details").innerHTML=html;
}

/* Calendar */
function generateCalendar(){
const calendar=document.getElementById("calendar");
calendar.innerHTML="";
let firstDay=new Date(currentYear,currentMonth,1).getDay();
let days=new Date(currentYear,currentMonth+1,0).getDate();

document.getElementById("monthTitle").innerText=
new Date(currentYear,currentMonth).toLocaleString('default',{month:'long'})+" "+currentYear;

for(let i=0;i<firstDay;i++) calendar.appendChild(document.createElement("div"));

for(let d=1;d<=days;d++){
let date=new Date(currentYear,currentMonth,d);
let today=new Date();

let cell=document.createElement("div");
cell.className="day";
cell.innerText=d;

if(d===today.getDate() && currentMonth===today.getMonth() && currentYear===today.getFullYear())
cell.classList.add("today");

cell.onclick=()=>showWorkout(date);

calendar.appendChild(cell);
}
}

/* Popup */
function showInfo(name){
document.getElementById("exerciseTitle").innerText=name;
document.getElementById("exerciseInfo").innerText=exerciseInfo[name] || "";
document.getElementById("infoModal").style.display="block";
}

function closeModal(){
document.getElementById("infoModal").style.display="none";
}

/* Navigation */
function prevMonth(){
currentMonth--;
if(currentMonth<0){currentMonth=11;currentYear--;}
generateCalendar();
}

function nextMonth(){
currentMonth++;
if(currentMonth>11){currentMonth=0;currentYear++;}
generateCalendar();
}

generateCalendar();

</script>
