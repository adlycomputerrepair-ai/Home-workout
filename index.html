<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Workout Calendar</title>
<style>
body{font-family:Arial; background:#f4f6f8; text-align:center;}
#calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; max-width:700px; margin:auto;}
.day{background:white; padding:15px; border-radius:8px; cursor:pointer; border:1px solid #ddd;}
.today{background:#4CAF50; color:white; font-weight:bold;}
#details{margin-top:20px; padding:20px; background:white; max-width:700px; margin-left:auto; margin-right:auto; border-radius:10px; border:1px solid #ddd; text-align:left;}
button{padding:8px 15px; margin:5px; border:none; background:#4CAF50; color:white; border-radius:5px; cursor:pointer;}
.infoBtn{background:#2196F3; padding:3px 8px; font-size:12px; margin-left:5px;}
input{width:80px; margin:3px;}
#infoModal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);}
#modalContent{background:white; padding:20px; max-width:400px; margin:100px auto; border-radius:10px; text-align:left;}
</style>
</head>
<body>

<h2 id="monthTitle"></h2>

<button onclick="prevMonth()">Previous</button>
<button onclick="nextMonth()">Next</button>
<button onclick="window.print()">Print Report</button>

<div id="calendar"></div>

<div id="details"><h3>Select a date to see workout</h3></div>

<div id="infoModal">
<div id="modalContent">
<h3 id="exerciseTitle"></h3>
<p id="exerciseInfo"></p>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>

let currentMonth=2;
let currentYear=2026;

/* Workout plan */
const workouts={
"Mon":{
pre:"Banana + peanut butter or bread + egg. Hydrate well before climbing.",
warmup:[
{name:"Jumping jacks", sets:1, reps:"60 sec"},
{name:"Arm circles", sets:1, reps:"30 sec"},
{name:"Wrist circles", sets:1, reps:"30 sec"},
{name:"Scapula pull ups", sets:2, reps:"10"}
],
main:[
{name:"Climbing (Technique focus)", sets:1, reps:"practice"},
{name:"Pull ups", sets:4, reps:"5-7"},
{name:"Single-arm dumbbell row", sets:3, reps:"10 each"},
{name:"Hanging leg raises", sets:3, reps:"10"}
],
cooldown:[
{name:"Forearm stretch", sets:1, reps:"30 sec"},
{name:"Shoulder stretch", sets:1, reps:"30 sec"}
],
post:"Protein + carbs (eggs + bread or shake). Focus on recovery."
},

"Tue":{
pre:"Light carbs like fruit or oats.",
warmup:[
{name:"Light jog", sets:1, reps:"5 min"},
{name:"Hip rotation", sets:1, reps:"10"}
],
main:[
{name:"Jogging", sets:1, reps:"3-4 km"},
{name:"Plank", sets:3, reps:"45 sec"},
{name:"Russian twist", sets:3, reps:"20"}
],
cooldown:[
{name:"Hamstring stretch", sets:1, reps:"30 sec"},
{name:"Quad stretch", sets:1, reps:"30 sec"}
],
post:"Hydrate and eat balanced meal."
},

"Wed":{
pre:"Banana or toast.",
warmup:[
{name:"Arm swing", sets:1, reps:"30 sec"},
{name:"Scapula activation", sets:2, reps:"10"}
],
main:[
{name:"Dead hang", sets:4, reps:"30 sec"},
{name:"Towel hang", sets:3, reps:"20 sec"},
{name:"Single-arm farmer hold", sets:3, reps:"30 sec each"},
{name:"Hammer curl (dumbbell)", sets:3, reps:"12"}
],
cooldown:[
{name:"Forearm stretch", sets:1, reps:"30 sec"},
{name:"Lat stretch", sets:1, reps:"30 sec"}
],
post:"Protein meal. Prioritize forearm recovery."
},

"Thu":{
pre:"Light snack or rest.",
warmup:[
{name:"Dynamic stretch", sets:1, reps:"5 min"}
],
main:[
{name:"Mobility session", sets:1, reps:"15 min"},
{name:"Core (plank)", sets:3, reps:"40 sec"}
],
cooldown:[
{name:"Back stretch", sets:1, reps:"1 min"}
],
post:"Hydration + light meal."
},

"Fri":{
pre:"Bread + egg or yogurt.",
warmup:[
{name:"Jumping jacks", sets:1, reps:"60 sec"},
{name:"Shoulder mobility", sets:1, reps:"10"}
],
main:[
{name:"Climbing (Power)", sets:1, reps:"practice"},
{name:"Pull ups", sets:4, reps:"max"},
{name:"Pike push ups", sets:3, reps:"8"},
{name:"Single-arm dumbbell shoulder press", sets:3, reps:"10 each"}
],
cooldown:[
{name:"Shoulder stretch", sets:1, reps:"30 sec"},
{name:"Back stretch", sets:1, reps:"30 sec"}
],
post:"Protein meal within 1 hour."
},

"Sat":{
pre:"Oatmeal or toast + eggs.",
warmup:[
{name:"Dynamic stretch", sets:1, reps:"3 min"}
],
main:[
{name:"Goblet squat (dumbbell)", sets:4, reps:"12"},
{name:"Pull ups", sets:4, reps:"max"},
{name:"Dead hang", sets:3, reps:"40 sec"},
{name:"Single-leg Romanian deadlift", sets:3, reps:"8 each"},
{name:"Leg raises", sets:3, reps:"12"}
],
cooldown:[
{name:"Hip flexor stretch", sets:1, reps:"30 sec"},
{name:"Back stretch", sets:1, reps:"30 sec"}
],
post:"Recovery meal (protein + carbs)."
},

"Sun":{
pre:"Rest day",
warmup:[],
main:[],
cooldown:[],
post:"Full rest. Sleep and recover."
}
};

/* Exercise info */
const exerciseInfo={
"Jumping jacks":"Full body warm-up. Jump while spreading legs and raising arms overhead, then return to start. Keep light on your feet and maintain steady rhythm. Helps increase heart rate and blood flow.",
"Arm circles":"Extend arms to the side and rotate in small to large circles. Do forward and backward. Keep shoulders relaxed. Warms up shoulder joints and prevents injury.",
"Wrist circles":"Rotate wrists slowly in both directions. Keep fingers relaxed. Important for climbers to prepare tendons and reduce risk of strain.",
"Scapula pull ups":"Hang on bar with straight arms. Pull shoulders down (engage scapula) without bending elbows. Builds shoulder stability and prevents injury.",
"Climbing":"Focus on technique, not just strength. Use legs more than arms, keep hips close to wall, and control movements. Improves coordination, grip, and endurance.",
"Pull ups":"Grip bar shoulder-width. Pull until chin passes bar. Avoid swinging. Control the way down. Builds back and arm strength essential for climbing.",
"Hanging leg raises":"Hang from bar and raise legs to 90° or higher. Keep core tight and avoid swinging. Strengthens core for body tension on wall.",
"Light jog":"Slow jogging to warm up body. Keep relaxed pace. Helps increase circulation and prepare muscles.",
"Hip rotation":"Rotate hips in circular motion. Keep movement controlled. Loosens hip joints for better mobility.",
"Jogging":"Steady pace running. Maintain breathing rhythm. Improves stamina and recovery between climbs.",
"Plank":"Hold straight body position. Engage core, don’t let hips drop. Builds core stability for climbing control.",
"Dead hang":"Hang from bar with full body weight. Keep shoulders slightly engaged. Builds grip strength and finger endurance.",
"Towel hang":"Hang using a towel over bar. Increases grip difficulty. Builds strong finger and forearm strength for climbing holds.",
"Russian twist":"Sit and rotate torso side to side. Keep core tight. Improves rotational core strength.",
"Dynamic stretch":"Controlled moving stretches (leg swings, arm swings). Avoid bouncing. Prepares muscles for activity.",
"Mobility session":"Light full-body movement focusing on joints. Improves flexibility and recovery.",
"Back stretch":"Gently stretch lower back. Hold without bouncing. Helps reduce tension after workout.",
"Shoulder mobility":"Arm swings, rotations, and light movements. Keeps shoulders flexible and injury-free.",
"Pike push ups":"Push-up position with hips high. Lower head toward ground. Targets shoulders for climbing pushing strength.",
"Squats":"Feet shoulder-width apart. Lower hips down, keep chest up. Builds leg strength for pushing on wall.",
"Hip flexor stretch":"Step forward into lunge and push hips forward. Stretches front hip muscles.",
"Lat stretch":"Reach arms overhead or hold bar and lean back. Stretches lats used heavily in climbing.",
"Forearm stretch":"Extend arm and pull fingers back gently. Helps reduce forearm tightness from gripping.",
"Shoulder stretch":"Pull arm across body or overhead. Relieves shoulder tension.",
"Hamstring stretch":"Reach toward toes while keeping legs straight. Stretches back of legs.",
"Quad stretch":"Pull one foot toward glutes. Keep knees close together. Stretches front thigh."
};

/* TIMER */
let timerInterval;

function startTimer(seconds,id){
clearInterval(timerInterval);
let remaining=seconds;

timerInterval=setInterval(()=>{
let min=Math.floor(remaining/60);
let sec=remaining%60;
document.getElementById(id).innerText=(min>0?min+"m ":"")+sec+"s";
remaining--;
if(remaining<0){
clearInterval(timerInterval);
document.getElementById(id).innerText="Done!";
}
},1000);
}

/* Save progress */
function saveProgress(dateKey,name,sets,reps){
let data=JSON.parse(localStorage.getItem("workoutProgress")||"{}");
if(!data[dateKey]) data[dateKey]={};
if(!data[dateKey][name]) data[dateKey][name]={};
if(sets!==null) data[dateKey][name].sets=sets;
if(reps!==null) data[dateKey][name].reps=reps;
localStorage.setItem("workoutProgress",JSON.stringify(data));
}

function getProgress(dateKey,name){
let data=JSON.parse(localStorage.getItem("workoutProgress")||"{}");
return data?.[dateKey]?.[name] || {};
}

function addTimerIfNeeded(name,reps){
let id="timer_"+name.replace(/\s/g,'');
if(reps.includes("sec")){
let sec=parseInt(reps);
return `<button onclick="startTimer(${sec},'${id}')">Timer</button> <span id="${id}"></span>`;
}
if(reps.includes("min")){
let sec=parseInt(reps)*60;
return `<button onclick="startTimer(${sec},'${id}')">Timer</button> <span id="${id}"></span>`;
}
return "";
}

function renderList(title,list,dateKey){
let html=`<h4>${title}</h4>`;
list.forEach(w=>{
let val=getProgress(dateKey,w.name);
html+=`
<div>
${w.name} (${w.sets} sets x ${w.reps})
<button class="infoBtn" onclick="showInfo('${w.name}')">ℹ</button>
${addTimerIfNeeded(w.name,w.reps)}
<br>
Sets Achieved
<input type="number" value="${val.sets||''}" onchange="saveProgress('${dateKey}','${w.name}',this.value,null)">
Reps/Time
<input type="number" value="${val.reps||''}" onchange="saveProgress('${dateKey}','${w.name}',null,this.value)">
</div>
`;
});
return html;
}

function showWorkout(date){
let day=date.toLocaleDateString('en-US',{weekday:'short'});
let data=workouts[day];
let dateKey=date.toISOString().split("T")[0];

let html=`<h3>${day} Workout</h3>`;
html+=`<h4>Pre-Workout</h4><p>${data.pre}</p>`;
html+=renderList("Warm Up",data.warmup,dateKey);
html+=renderList("Workout",data.main,dateKey);
html+=renderList("Cool Down",data.cooldown,dateKey);
html+=`<h4>Post-Workout</h4><p>${data.post}</p>`;

document.getElementById("details").innerHTML=html;
}

/* Calendar */
function generateCalendar(){
const calendar=document.getElementById("calendar");
calendar.innerHTML="";
let firstDay=new Date(currentYear,currentMonth,1).getDay();
let days=new Date(currentYear,currentMonth+1,0).getDate();

document.getElementById("monthTitle").innerText=
new Date(currentYear,currentMonth).toLocaleString('default',{month:'long'})+" "+currentYear;

for(let i=0;i<firstDay;i++) calendar.appendChild(document.createElement("div"));

for(let d=1;d<=days;d++){
let date=new Date(currentYear,currentMonth,d);
let today=new Date();

let cell=document.createElement("div");
cell.className="day";
cell.innerText=d;

if(d===today.getDate() && currentMonth===today.getMonth() && currentYear===today.getFullYear())
cell.classList.add("today");

cell.onclick=()=>showWorkout(date);

calendar.appendChild(cell);
}
}

/* Popup */
function showInfo(name){
document.getElementById("exerciseTitle").innerText=name;
document.getElementById("exerciseInfo").innerText=exerciseInfo[name] || "";
document.getElementById("infoModal").style.display="block";
}

function closeModal(){
document.getElementById("infoModal").style.display="none";
}

/* Navigation */
function prevMonth(){
currentMonth--;
if(currentMonth<0){currentMonth=11;currentYear--;}
generateCalendar();
}

function nextMonth(){
currentMonth++;
if(currentMonth>11){currentMonth=0;currentYear++;}
generateCalendar();
}

generateCalendar();

</script>
</body>
</html>
