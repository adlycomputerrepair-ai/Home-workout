<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Workout Calendar</title>
<style>
body{font-family:Arial; background:#f4f6f8; text-align:center;}
#calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; max-width:700px; margin:auto;}
.day{background:white; padding:15px; border-radius:8px; cursor:pointer; border:1px solid #ddd;}
.today{background:#4CAF50; color:white; font-weight:bold;}
#details{margin-top:20px; padding:20px; background:white; max-width:700px; margin-left:auto; margin-right:auto; border-radius:10px; border:1px solid #ddd; text-align:left;}
button{padding:8px 15px; margin:5px; border:none; background:#4CAF50; color:white; border-radius:5px; cursor:pointer;}
.infoBtn{background:#2196F3; padding:3px 8px; font-size:12px; margin-left:5px;}
input{width:80px; margin:3px;}
#infoModal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);}
#modalContent{background:white; padding:20px; max-width:400px; margin:100px auto; border-radius:10px; text-align:left;}
</style>
</head>
<body>

<h2 id="monthTitle"></h2>

<button onclick="prevMonth()">Previous</button>
<button onclick="nextMonth()">Next</button>
<button onclick="window.print()">Print Report</button>

<div id="calendar"></div>

<div id="details"><h3>Select a date to see workout</h3></div>

<div id="infoModal">
<div id="modalContent">
<h3 id="exerciseTitle"></h3>
<p id="exerciseInfo"></p>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>

let currentMonth=2;
let currentYear=2026;

/* Workout plan */
const workouts={

"Mon":{
pre:"Light snack. Gym closed → optional home or climbing technique.",
warmup:[
{name:"Jumping jacks", sets:1, reps:"60 sec"},
{name:"Arm circles", sets:1, reps:"30 sec"},
{name:"Wrist circles", sets:1, reps:"30 sec"}
],
main:[
{name:"Light climbing / technique", sets:1, reps:"practice"},
{name:"Pull ups", sets:3, reps:"easy"},
{name:"Stretch & mobility", sets:1, reps:"10 min"}
],
cooldown:[
{name:"Forearm stretch", sets:1, reps:"30 sec"},
{name:"Shoulder stretch", sets:1, reps:"30 sec"}
],
post:"Recovery day. Light protein intake."
},

"Tue":{ // PULL DAY (Gym)
pre:"Banana or oats. Hydrate well.",
warmup:[
{name:"Light jog", sets:1, reps:"5 min"},
{name:"Scapula pull ups", sets:2, reps:"10"}
],
main:[
{name:"Lat pulldown", sets:4, reps:"10"},
{name:"Pull ups", sets:4, reps:"5-7"},
{name:"Seated cable row", sets:3, reps:"10"},
{name:"Single-arm dumbbell row", sets:3, reps:"10 each"},
{name:"Hammer curl (dumbbell)", sets:3, reps:"12"}
],
cooldown:[
{name:"Lat stretch", sets:1, reps:"30 sec"},
{name:"Forearm stretch", sets:1, reps:"30 sec"}
],
post:"Protein + carbs. Recovery for back muscles."
},

"Wed":{ // CARDIO + CORE
pre:"Light carbs.",
warmup:[
{name:"Light jog", sets:1, reps:"5 min"}
],
main:[
{name:"Jogging", sets:1, reps:"3-4 km"},
{name:"Plank", sets:3, reps:"45 sec"},
{name:"Russian twist", sets:3, reps:"20"},
{name:"Hanging leg raises", sets:3, reps:"10"}
],
cooldown:[
{name:"Hamstring stretch", sets:1, reps:"30 sec"},
{name:"Quad stretch", sets:1, reps:"30 sec"}
],
post:"Hydrate + balanced meal."
},

"Thu":{ // GRIP + FOREARM (Gym)
pre:"Banana or toast.",
warmup:[
{name:"Arm swing", sets:1, reps:"30 sec"},
{name:"Wrist circles", sets:1, reps:"30 sec"}
],
main:[
{name:"Dead hang", sets:4, reps:"30 sec"},
{name:"Towel hang", sets:3, reps:"20 sec"},
{name:"Single-arm farmer hold", sets:3, reps:"30 sec each"},
{name:"Cable wrist curl", sets:3, reps:"12"},
{name:"Reverse wrist curl", sets:3, reps:"12"}
],
cooldown:[
{name:"Forearm stretch", sets:1, reps:"30 sec"},
{name:"Lat stretch", sets:1, reps:"30 sec"}
],
post:"Protein. Focus on forearm recovery."
},

"Fri":{ // PUSH + CLIMB POWER
pre:"Bread + egg or yogurt.",
warmup:[
{name:"Jumping jacks", sets:1, reps:"60 sec"},
{name:"Shoulder mobility", sets:1, reps:"10"}
],
main:[
{name:"Climbing (Power)", sets:1, reps:"practice"},
{name:"Pike push ups", sets:3, reps:"8"},
{name:"Single-arm dumbbell shoulder press", sets:3, reps:"10 each"},
{name:"Chest press machine", sets:3, reps:"10"},
{name:"Tricep pushdown", sets:3, reps:"12"}
],
cooldown:[
{name:"Shoulder stretch", sets:1, reps:"30 sec"},
{name:"Back stretch", sets:1, reps:"30 sec"}
],
post:"Protein within 1 hour."
},

"Sat":{ // LEGS + FULL BODY
pre:"Oatmeal or toast + eggs.",
warmup:[
{name:"Dynamic stretch", sets:1, reps:"3 min"}
],
main:[
{name:"Goblet squat (dumbbell)", sets:4, reps:"12"},
{name:"Leg press machine", sets:3, reps:"12"},
{name:"Single-leg Romanian deadlift", sets:3, reps:"8 each"},
{name:"Pull ups", sets:4, reps:"max"},
{name:"Dead hang", sets:3, reps:"40 sec"}
],
cooldown:[
{name:"Hip flexor stretch", sets:1, reps:"30 sec"},
{name:"Back stretch", sets:1, reps:"30 sec"}
],
post:"Recovery meal (protein + carbs)."
},

"Sun":{ // ACTIVE RECOVERY
pre:"Light food or empty stomach ok.",
warmup:[
{name:"Light jog", sets:1, reps:"5 min"}
],
main:[
{name:"Mobility session", sets:1, reps:"15 min"},
{name:"Light climbing / easy routes", sets:1, reps:"practice"}
],
cooldown:[
{name:"Full body stretch", sets:1, reps:"5 min"}
],
post:"Hydration + rest."
}
};

/* Exercise info */
const exerciseInfo={

"Jumping jacks":"Full body warm-up. Jump while spreading legs and raising arms overhead, then return. Keep movement light and rhythmic. Purpose: raise heart rate and prepare body for climbing.",

"Arm circles":"Extend arms sideways and rotate in controlled circles (forward and backward). Start small, increase size. Purpose: warm shoulder joints and prevent injury during pulling movements.",

"Wrist circles":"Rotate wrists slowly both directions. Keep fingers relaxed. Purpose: prepare finger tendons and wrists for gripping holds.",

"Scapula pull ups":"Hang on bar with straight arms. Pull shoulders down and slightly back without bending elbows. Purpose: activate shoulder stabilizers and reduce injury risk when climbing.",

"Climbing (Technique focus)":"Climb easy routes focusing on foot placement, balance, and smooth movement. Keep hips close to wall and use legs more than arms. Purpose: improve efficiency and conserve energy.",

"Pull ups":"Grip bar shoulder-width. Pull until chin passes bar, then lower slowly. Avoid swinging. Purpose: build pulling strength for climbing. Tip: quality reps over quantity.",

"Single-arm dumbbell row":"Place one hand on support, pull dumbbell toward hip. Keep back flat. Purpose: strengthen lats and improve unilateral pulling strength (important for uneven holds).",

"Hanging leg raises":"Hang from bar and raise legs to 90° or higher. Keep core tight, avoid swinging. Purpose: build core tension for maintaining body position on wall.",

"Light jog":"Slow jog to increase blood flow. Keep relaxed pace. Purpose: prepare body for cardio or endurance training.",

"Hip rotation":"Rotate hips in controlled circles. Purpose: loosen hip joints for better movement and foot placement while climbing.",

"Jogging":"Steady pace running. Maintain breathing rhythm. Purpose: improve endurance and recovery between climbs.",

"Plank":"Hold straight body line (head to heels). Engage core, don’t let hips sag. Purpose: core stability for body tension on wall.",

"Russian twist":"Sit and rotate torso side-to-side. Keep core tight. Purpose: improve rotational core strength and control.",

"Arm swing":"Swing arms forward and backward in controlled motion. Purpose: loosen shoulders before climbing.",

"Scapula activation":"Light scapula engagement (similar to scapula pull-ups but easier). Purpose: activate back muscles before load.",

"Dead hang":"Hang from bar with full body weight. Slight shoulder engagement. Purpose: build grip endurance and finger strength.",

"Towel hang":"Hang using towel over bar. Grip harder due to instability. Purpose: simulate climbing holds and improve grip strength.",

"Single-arm farmer hold":"Hold dumbbell in one hand and stand upright. Keep core tight. Purpose: build grip strength and core stability (anti-tilt).",

"Hammer curl (dumbbell)":"Curl dumbbell with neutral grip (thumb up). Purpose: strengthen forearms and brachialis for pulling strength.",

"Dynamic stretch":"Controlled moving stretches (leg swings, arm swings). Avoid bouncing. Purpose: prepare muscles for movement.",

"Mobility session":"Light full-body mobility work. Focus on joints (hips, shoulders, spine). Purpose: improve flexibility and reduce injury risk.",

"Core (plank)":"Standard plank hold focusing on tight core and breathing. Purpose: reinforce core endurance for climbing stability.",

"Back stretch":"Gently stretch lower back (e.g., child’s pose). Purpose: relieve tension after workouts.",

"Shoulder mobility":"Light rotations and controlled movement. Purpose: keep shoulders flexible and reduce injury risk.",

"Climbing (Power)":"Climb harder routes or explosive moves. Focus on dynamic movement and strength. Purpose: develop power and contact strength.",

"Pike push ups":"Push-up with hips raised. Lower head toward floor. Purpose: build shoulder pushing strength (useful for mantles).",

"Single-arm dumbbell shoulder press":"Press dumbbell overhead with one arm. Keep core tight. Purpose: improve shoulder strength and stability.",

"Goblet squat (dumbbell)":"Hold dumbbell at chest and squat down. Keep chest up and knees stable. Purpose: build leg strength for pushing on footholds.",

"Single-leg Romanian deadlift":"Hold dumbbell, hinge forward on one leg. Keep balance and back straight. Purpose: improve balance and posterior chain strength.",

"Leg raises":"Lying or hanging leg raises. Keep movement controlled. Purpose: strengthen lower abs for climbing tension.",

"Hip flexor stretch":"Lunge position, push hips forward. Purpose: loosen hips for better high steps.",

"Lat stretch":"Reach overhead or hold bar and lean back. Purpose: stretch lats used heavily in pulling.",

"Forearm stretch":"Extend arm and gently pull fingers back. Purpose: reduce tightness from gripping.",

"Shoulder stretch":"Pull arm across body or overhead. Purpose: relieve shoulder tension.",

"Hamstring stretch":"Reach toward toes while keeping legs straight. Purpose: improve flexibility for high foot placement.",

"Quad stretch":"Pull foot toward glutes. Keep knees together. Purpose: stretch front thigh after leg work."

};

/* TIMER */
let timerInterval;

function startTimer(seconds,id){
clearInterval(timerInterval);
let remaining=seconds;

timerInterval=setInterval(()=>{
let min=Math.floor(remaining/60);
let sec=remaining%60;
document.getElementById(id).innerText=(min>0?min+"m ":"")+sec+"s";
remaining--;
if(remaining<0){
clearInterval(timerInterval);
document.getElementById(id).innerText="Done!";
}
},1000);
}

/* Save progress */
function saveProgress(dateKey,name,sets,reps){
let data=JSON.parse(localStorage.getItem("workoutProgress")||"{}");
if(!data[dateKey]) data[dateKey]={};
if(!data[dateKey][name]) data[dateKey][name]={};
if(sets!==null) data[dateKey][name].sets=sets;
if(reps!==null) data[dateKey][name].reps=reps;
localStorage.setItem("workoutProgress",JSON.stringify(data));
}

function getProgress(dateKey,name){
let data=JSON.parse(localStorage.getItem("workoutProgress")||"{}");
return data?.[dateKey]?.[name] || {};
}

function addTimerIfNeeded(name,reps){
let id="timer_"+name.replace(/\s/g,'');
if(reps.includes("sec")){
let sec=parseInt(reps);
return `<button onclick="startTimer(${sec},'${id}')">Timer</button> <span id="${id}"></span>`;
}
if(reps.includes("min")){
let sec=parseInt(reps)*60;
return `<button onclick="startTimer(${sec},'${id}')">Timer</button> <span id="${id}"></span>`;
}
return "";
}

function renderList(title,list,dateKey){
let html=`<h4>${title}</h4>`;
list.forEach(w=>{
let val=getProgress(dateKey,w.name);
html+=`
<div>
${w.name} (${w.sets} sets x ${w.reps})
<button class="infoBtn" onclick="showInfo('${w.name}')">ℹ</button>
${addTimerIfNeeded(w.name,w.reps)}
<br>
Sets Achieved
<input type="number" value="${val.sets||''}" onchange="saveProgress('${dateKey}','${w.name}',this.value,null)">
Reps/Time
<input type="number" value="${val.reps||''}" onchange="saveProgress('${dateKey}','${w.name}',null,this.value)">
</div>
`;
});
return html;
}

function showWorkout(date){
let day=date.toLocaleDateString('en-US',{weekday:'short'});
let data=workouts[day];
let dateKey=date.toISOString().split("T")[0];

let html=`<h3>${day} Workout</h3>`;
html+=`<h4>Pre-Workout</h4><p>${data.pre}</p>`;
html+=renderList("Warm Up",data.warmup,dateKey);
html+=renderList("Workout",data.main,dateKey);
html+=renderList("Cool Down",data.cooldown,dateKey);
html+=`<h4>Post-Workout</h4><p>${data.post}</p>`;

document.getElementById("details").innerHTML=html;
}

/* Calendar */
function generateCalendar(){
const calendar=document.getElementById("calendar");
calendar.innerHTML="";
let firstDay=new Date(currentYear,currentMonth,1).getDay();
let days=new Date(currentYear,currentMonth+1,0).getDate();

document.getElementById("monthTitle").innerText=
new Date(currentYear,currentMonth).toLocaleString('default',{month:'long'})+" "+currentYear;

for(let i=0;i<firstDay;i++) calendar.appendChild(document.createElement("div"));

for(let d=1;d<=days;d++){
let date=new Date(currentYear,currentMonth,d);
let today=new Date();

let cell=document.createElement("div");
cell.className="day";
cell.innerText=d;

if(d===today.getDate() && currentMonth===today.getMonth() && currentYear===today.getFullYear())
cell.classList.add("today");

cell.onclick=()=>showWorkout(date);

calendar.appendChild(cell);
}
}

/* Popup */
function showInfo(name){
document.getElementById("exerciseTitle").innerText=name;
document.getElementById("exerciseInfo").innerText=exerciseInfo[name] || "";
document.getElementById("infoModal").style.display="block";
}

function closeModal(){
document.getElementById("infoModal").style.display="none";
}

/* Navigation */
function prevMonth(){
currentMonth--;
if(currentMonth<0){currentMonth=11;currentYear--;}
generateCalendar();
}

function nextMonth(){
currentMonth++;
if(currentMonth>11){currentMonth=0;currentYear++;}
generateCalendar();
}

generateCalendar();

</script>
</body>
</html>
